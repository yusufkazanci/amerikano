<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3d2c">
<title>Amerikano Skor</title>
<style>
:root{
  --felt:#0f3d2c; --felt-dark:#0a2a1f; --felt-light:#17573f;
  --cream:#f6efdc; --cream-dim:#d9cfb4; --ink:#1d2a22;
  --gold:#e3b650; --gold-dark:#b88a26; --red:#c9473a; --good:#5bbf84;
  --radius:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  color:var(--cream);
  background:radial-gradient(ellipse at 50% 0%,var(--felt-light) 0%,var(--felt) 45%,var(--felt-dark) 100%) fixed;
  padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));
}
#app{max-width:560px;margin:0 auto}
h1{font-size:15px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin:4px 0 16px;text-align:center;font-weight:600}
.card{background:var(--cream);color:var(--ink);border-radius:var(--radius);padding:18px;box-shadow:0 6px 0 rgba(0,0,0,.25),0 14px 30px rgba(0,0,0,.25)}
.btn{
  appearance:none;border:0;border-radius:14px;font:inherit;font-weight:700;font-size:18px;
  padding:16px 20px;cursor:pointer;width:100%;color:var(--ink);background:var(--gold);
  box-shadow:0 4px 0 var(--gold-dark);transition:transform .08s,box-shadow .08s;
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold-dark)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.ghost{background:transparent;color:var(--cream);box-shadow:inset 0 0 0 2px rgba(246,239,220,.35)}
.btn.ghost:active{transform:none;background:rgba(255,255,255,.08)}
.btn.light{background:#e7dfc6;box-shadow:0 4px 0 #bdb391}
.row{display:flex;gap:12px}
.row>*{flex:1}
.stack>*+*{margin-top:12px}

/* setup */
.field{display:block}
.field span{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#5d6a60;margin-bottom:4px;font-weight:600}
input[type=text],input[type=number]{
  width:100%;font:inherit;font-size:20px;padding:12px 14px;border-radius:12px;border:2px solid #cfc5a7;
  background:#fffaf0;color:var(--ink);outline:none;
}
input:focus{border-color:var(--gold-dark)}
input:disabled{background:#e9e2cb;color:#8b8670}

/* scoreboard */
.totals{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.tot{background:rgba(0,0,0,.25);border-radius:14px;padding:10px 6px;text-align:center;border:2px solid transparent;min-width:0}
.tot.lead{border-color:var(--gold);background:rgba(227,182,80,.14)}
.tot .nm{font-size:13px;color:var(--cream-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tot .sc{font-size:28px;font-weight:800;line-height:1.2}
.tot.lead .sc{color:var(--gold)}
.crown{font-size:12px;height:14px}

.current{margin-bottom:14px;text-align:center}
.current .lbl{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#5d6a60;font-weight:700}
.current .rule{font-size:26px;font-weight:800;line-height:1.2;margin:6px 0 4px}
.current .pos{font-size:14px;color:#5d6a60}

.table{width:100%;border-collapse:collapse;font-size:15px;margin-top:6px}
.table th{font-size:11px;letter-spacing:.06em;color:var(--cream-dim);text-transform:uppercase;padding:6px 2px;text-align:center;font-weight:600;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.table td{padding:9px 2px;text-align:center;border-top:1px solid rgba(246,239,220,.12);font-variant-numeric:tabular-nums}
.table td.h{text-align:left;color:var(--cream-dim);font-size:12px;padding-left:4px;width:34%}
.table tr.played{cursor:pointer}
.table tr.played:active{background:rgba(255,255,255,.07)}
.table tr.cur td{background:rgba(227,182,80,.13)}
.table tr.cur td.h{color:var(--gold);font-weight:700}
.table tr.pending td{opacity:.4}
.table tr.skipped td{opacity:.35;font-style:italic}
.win{color:var(--good);font-weight:800}
.pen{color:#ff9d90;font-size:11px;display:block;line-height:1}
.hint{font-size:12px;color:var(--cream-dim);text-align:center;margin-top:10px}
.sheet{margin-top:16px}

/* entry */
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:14px}
.dots i{width:28px;height:6px;border-radius:3px;background:rgba(246,239,220,.25)}
.dots i.on{background:var(--gold)}
.dots i.done{background:var(--good)}
.who{font-size:30px;font-weight:800;text-align:center;margin:0 0 4px}
.sub{text-align:center;color:#5d6a60;font-size:14px;margin-bottom:16px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{
  width:60px;height:60px;border-radius:14px;border:0;font-size:30px;font-weight:700;cursor:pointer;
  background:#e7dfc6;color:var(--ink);box-shadow:0 4px 0 #bdb391;
}
.stepper button:active{transform:translateY(3px);box-shadow:0 1px 0 #bdb391}
.stepper .val{flex:1;text-align:center;font-size:34px;font-weight:800}
.stepper .val small{display:block;font-size:12px;color:#5d6a60;font-weight:600;letter-spacing:.06em}
.check{
  display:flex;align-items:center;gap:12px;padding:14px;border-radius:12px;background:#fffaf0;border:2px solid #cfc5a7;
  font-size:18px;font-weight:700;cursor:pointer;user-select:none;
}
.check.on{border-color:var(--good);background:#e5f5ea}
.check input{width:24px;height:24px;accent-color:#2e8f5b}
.preview{text-align:center;font-size:15px;color:#5d6a60;margin-top:14px}
.preview b{font-size:22px;color:var(--ink)}

/* end */
.trophy{font-size:64px;text-align:center}
.final{list-style:none;padding:0;margin:14px 0}
.final li{display:flex;justify-content:space-between;padding:12px 4px;border-top:1px solid rgba(246,239,220,.15);font-size:20px}
.final li:first-child{border-top:0;color:var(--gold);font-weight:800;font-size:24px}
.center{text-align:center}
.link{background:none;border:0;color:var(--cream-dim);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;margin-top:16px;display:block;margin-left:auto;margin-right:auto}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const LADDER = [
  "1 üçlü küt / 1 üçlü seri",
  "2 üçlü küt",
  "2 üçlü seri",
  "1 dörtlü küt",
  "1 dörtlü seri",
  "1 dörtlü küt / 1 üçlü seri",
  "1 dörtlü seri / 1 üçlü küt",
  "1 dörtlü küt / 1 dörtlü seri",
  "3 üçlü küt",
  "3 üçlü seri",
  "1 beşli seri",
  "1 altılı seri",
  "1 dörtlü küt / 2 üçlü seri",
  "1 dörtlü seri / 2 üçlü küt",
  "Biter"
];
const N = 4, PEN = 25, BONUS = 25, KEY = "amerikano-v1";

let S = load() || fresh();
let draft = null;   // {hand, step, tiles[], pen[], winner, editing}

function fresh(){
  return { phase:"setup", names:["","","",""], cur:0, hands: LADDER.map(()=>({status:"pending"})) };
}
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)); }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const name = i => S.names[i];

function handScore(h,i){ return h.tiles[i] + h.pen[i]*PEN - (h.winner===i?BONUS:0); }
function totals(){
  const t = [0,0,0,0];
  S.hands.forEach(h=>{ if(h.status==="played") for(let i=0;i<N;i++) t[i]+=handScore(h,i); });
  return t;
}
function nextPending(from){
  for(let i=from;i<LADDER.length;i++) if(S.hands[i].status==="pending") return i;
  return -1;
}
function advance(){
  const n = nextPending(S.cur+1);
  if(n<0){ S.phase="end"; } else { S.cur=n; S.phase="ask"; }
  save(); render();
}

/* ---------- views ---------- */
function render(){
  const a = $("#app");
  if(draft) a.innerHTML = viewEntry();
  else if(S.phase==="setup") a.innerHTML = viewSetup();
  else if(S.phase==="ask") a.innerHTML = viewAsk();
  else if(S.phase==="end") a.innerHTML = viewEnd();
  else a.innerHTML = viewPlay();
  bind();
}

function viewSetup(){
  return `<h1>Amerikano</h1>
  <div class="card stack">
    <div class="center" style="font-weight:800;font-size:22px">Oyuncular</div>
    ${[0,1,2,3].map(i=>`<label class="field"><span>Oyuncu ${i+1}</span>
      <input type="text" data-name="${i}" maxlength="12" autocomplete="off" value="${esc(S.names[i])}" placeholder="İsim"></label>`).join("")}
    <button class="btn" id="start" disabled>Başla</button>
  </div>`;
}

function scoreboard(){
  const t = totals(), min = Math.min(...t);
  const anyPlayed = S.hands.some(h=>h.status==="played");
  const head = `<div class="totals">${t.map((v,i)=>`
    <div class="tot ${anyPlayed&&v===min?"lead":""}">
      <div class="crown">${anyPlayed&&v===min?"👑":""}</div>
      <div class="nm">${esc(name(i))}</div><div class="sc">${v}</div></div>`).join("")}</div>`;
  const rows = LADDER.map((r,k)=>{
    const h = S.hands[k];
    const isCur = S.phase!=="end" && k===S.cur;
    if(h.status==="played"){
      return `<tr class="played" data-edit="${k}"><td class="h">${k+1}. ${esc(r)}</td>${[0,1,2,3].map(i=>{
        const sc = handScore(h,i);
        return `<td class="${h.winner===i?"win":""}">${sc}${h.pen[i]?`<span class="pen">${h.pen[i]>0?"+":""}${h.pen[i]}×25</span>`:""}</td>`;
      }).join("")}</tr>`;
    }
    if(h.status==="skipped") return `<tr class="skipped"><td class="h">${k+1}. ${esc(r)}</td><td colspan="4">atlandı</td></tr>`;
    return `<tr class="pending ${isCur?"cur":""}"><td class="h">${k+1}. ${esc(r)}</td><td colspan="4">${isCur?"şimdi":"—"}</td></tr>`;
  }).join("");
  return `${head}
  <table class="table"><thead><tr><th></th>${[0,1,2,3].map(i=>`<th>${esc(name(i))}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table>
  ${anyPlayed?`<div class="hint">Düzeltmek için oynanmış bir satıra dokun</div>`:""}`;
}

function viewAsk(){
  return `<h1>Amerikano</h1>
  <div class="card current">
    <div class="lbl">El ${S.cur+1} / ${LADDER.length}</div>
    <div class="rule">${esc(LADDER[S.cur])}</div>
    <div class="pos">Bu eli oynuyor muyuz?</div>
    <div class="row" style="margin-top:16px">
      <button class="btn light" id="skip">Bu Eli Atla</button>
      <button class="btn" id="play">Oyna</button>
    </div>
  </div>
  <div class="sheet">${scoreboard()}</div>
  ${resetLink()}`;
}

function viewPlay(){
  return `<h1>Amerikano</h1>
  <div class="card current">
    <div class="lbl">El ${S.cur+1} / ${LADDER.length}</div>
    <div class="rule">${esc(LADDER[S.cur])}</div>
    <button class="btn" id="done" style="margin-top:14px">El Bitti</button>
  </div>
  ${scoreboard()}
  ${resetLink()}`;
}

function viewEnd(){
  const t = totals(), min = Math.min(...t);
  const order = [0,1,2,3].sort((a,b)=>t[a]-t[b]);
  const winners = order.filter(i=>t[i]===min).map(name).join(" & ");
  return `<h1>Oyun Bitti</h1>
  <div class="card">
    <div class="trophy">🏆</div>
    <div class="center" style="font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#5d6a60;font-weight:700;margin-top:6px">Kazanan</div>
    <div class="center" style="font-size:32px;font-weight:800">${esc(winners)}</div>
  </div>
  <ul class="final">${order.map(i=>`<li><span>${esc(name(i))}</span><span>${t[i]}</span></li>`).join("")}</ul>
  <div class="stack">
    <button class="btn" id="again">Yeni Oyun (aynı oyuncular)</button>
    <button class="btn ghost" id="newnames">Yeni Oyuncular</button>
  </div>
  <div class="sheet">${scoreboard()}</div>`;
}

function resetLink(){ return `<button class="link" id="reset">Oyunu sıfırla</button>`; }

function viewEntry(){
  const d = draft, i = d.step, w = d.winner===i;
  const dots = [0,1,2,3].map(k=>`<i class="${k===i?"on":(k<i?"done":"")}"></i>`).join("");
  const last = i===N-1;
  return `<h1>El ${d.hand+1} · ${esc(LADDER[d.hand])}</h1>
  <div class="dots">${dots}</div>
  <div class="card stack">
    <div><div class="who">${esc(name(i))}</div><div class="sub">${i+1} / ${N}</div></div>
    <label class="field"><span>Elde kalan puan</span>
      <input type="number" inputmode="numeric" id="tiles" min="0" ${w?"disabled":""} value="${d.tiles[i]===null?"":d.tiles[i]}" placeholder="0"></label>
    <div>
      <div class="field"><span>Ceza Adedi (× ${PEN})</span></div>
      <div class="stepper">
        <button id="pm" aria-label="Azalt">−</button>
        <div class="val" id="pv">${d.pen[i]}<small>= ${d.pen[i]*PEN} puan</small></div>
        <button id="pp" aria-label="Artır">+</button>
      </div>
    </div>
    <label class="check ${w?"on":""}"><input type="checkbox" id="win" ${w?"checked":""}> Biten Kişi <span style="margin-left:auto;font-weight:600;color:#5d6a60;font-size:14px">−${BONUS}</span></label>
    <div class="preview">Bu el: <b id="pre"></b></div>
    <div class="row">
      <button class="btn ghost" id="back" style="color:var(--ink);box-shadow:inset 0 0 0 2px #bdb391">${i===0?"İptal":"Geri"}</button>
      <button class="btn" id="next">${last?"Kaydet":"İleri"}</button>
    </div>
  </div>`;
}

/* ---------- events ---------- */
function bind(){
  const on=(id,fn)=>{ const e=$(id); if(e) e.onclick=fn; };

  document.querySelectorAll("[data-name]").forEach(inp=>{
    inp.oninput=()=>{
      S.names[+inp.dataset.name]=inp.value.trim();
      $("#start").disabled = S.names.some(n=>!n);
      save();
    };
  });
  if($("#start")) $("#start").disabled = S.names.some(n=>!n);
  on("#start",()=>{ S.phase="ask"; S.cur=0; save(); render(); });

  on("#play",()=>{ S.phase="play"; save(); render(); });
  on("#skip",()=>{ S.hands[S.cur]={status:"skipped"}; advance(); });
  on("#done",()=>{ draft={hand:S.cur,step:0,tiles:[null,null,null,null],pen:[0,0,0,0],winner:-1,editing:false}; render(); });

  document.querySelectorAll("[data-edit]").forEach(r=>{
    r.onclick=()=>{
      const k=+r.dataset.edit, h=S.hands[k];
      draft={hand:k,step:0,tiles:[...h.tiles],pen:[...h.pen],winner:h.winner,editing:true};
      render();
    };
  });

  on("#reset",()=>{ if(confirm("Oyun sıfırlansın mı? Tüm skorlar silinir.")){ S=fresh(); save(); render(); } });
  on("#again",()=>{ const n=S.names; S=fresh(); S.names=n; S.phase="ask"; save(); render(); });
  on("#newnames",()=>{ S=fresh(); save(); render(); });

  if(draft) bindEntry();
}

function bindEntry(){
  const d=draft, i=d.step;
  const tilesEl=$("#tiles"), next=$("#next");
  const refresh=()=>{
    const t = d.winner===i ? 0 : d.tiles[i];
    next.disabled = t===null || Number.isNaN(t);
    const sc = (t||0) + d.pen[i]*PEN - (d.winner===i?BONUS:0);
    $("#pre").textContent = sc;
    $("#pv").innerHTML = `${d.pen[i]}<small>= ${d.pen[i]*PEN} puan</small>`;
  };
  tilesEl.oninput=()=>{ d.tiles[i] = tilesEl.value===""?null:Math.max(0,parseInt(tilesEl.value,10)); refresh(); };
  $("#pm").onclick=()=>{ d.pen[i]--; refresh(); };
  $("#pp").onclick=()=>{ d.pen[i]++; refresh(); };
  $("#win").onchange=e=>{
    if(e.target.checked){
      if(d.winner>=0 && d.winner!==i && d.tiles[d.winner]===0) d.tiles[d.winner]=null; // previous finisher unlocked
      d.winner=i; d.tiles[i]=0;
    } else { d.winner=-1; d.tiles[i]=null; }
    render();
  };
  $("#back").onclick=()=>{
    if(i===0){
      draft=null; render();
    } else { d.step--; render(); }
  };
  next.onclick=()=>{
    if(i<N-1){ d.step++; render(); return; }
    // all four must have values (a winner elsewhere may have unlocked someone)
    const missing = d.tiles.findIndex((t,k)=>t===null && d.winner!==k);
    if(missing>=0){ d.step=missing; render(); toast(`${name(missing)} için puan gir`); return; }
    S.hands[d.hand]={status:"played",tiles:d.tiles.map((t,k)=>d.winner===k?0:t),pen:[...d.pen],winner:d.winner};
    const wasEdit=d.editing;
    draft=null;
    if(wasEdit){ save(); render(); } else advance();
  };
  refresh();
  if(!tilesEl.disabled) tilesEl.focus();
}

function toast(msg){
  const t=document.createElement("div"); t.className="toast"; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2200);
}

render();
</script>
</body>
</html>
